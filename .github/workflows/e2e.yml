name: e2e tests

# on change to test files
# on:
#   push:
#     branches: [ main, master ]
#   pull_request:
#     branches: [ main, master ]

# schedule run
# on:
#   schedule:
#     - cron: "30 8 * * 1-5"   # <=== Change this value
#   workflow_dispatch:

# manual run

on:
  workflow_dispatch:

jobs:
  e2e:
    env:
      HOME: /root
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.0
    steps:
      - uses: actions/checkout@v4

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Debug step: Check if trend file exists before running tests
      - name: Debug Trend File Before Test
        run: if [ -f "./test-results/report.json" ]; then echo "Trend file exists before run."; else echo "Trend file does NOT exist before run."; fi

      # Run E2E Tests
      - name: Run E2E Tests
        run: npx playwright test

      # Debug step: Check if trend file exists after running tests
      - name: Debug Trend File After Test
        run: if [ -f "./test-results/report.json" ]; then echo "Trend file exists after run."; else echo "Trend file does NOT exist after run."; fi

      # Debug step: List contents of the test-results directory
      - name: List Test Results Directory
        run: ls -al ./test-results

      # Upload Monocart Report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Monocart Report
          path: test-results/report.html

      # Upload Updated Trend Data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-data
          path: ./test-results/report.json
